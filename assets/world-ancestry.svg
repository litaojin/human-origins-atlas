<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 497" role="img" aria-label="存在、祖源与文化：不同的证据问题"><title>存在、祖源与文化：不同的证据问题</title><desc>三列分别提出不同证据责任，不是人口树、文化传播路线或祖源比例图。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">存在、祖源与文化：不同的证据问题</text><text x="30" y="74" font-size="17">作者概念对照 · 非古地理复原 · 无定量人口或祖源估计</text><rect x="30" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="47" y="137" font-size="21">存在记录</text><text x="47" y="180" font-size="17">问题：何时、何地有人类活动？</text><text x="47" y="231" font-size="17">材料：遗存、层位与年代。</text><text x="47" y="282" font-size="17">不能单独回答后世祖源贡献。</text><rect x="340" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="357" y="137" font-size="21">祖源历史</text><text x="357" y="180" font-size="17">问题：样本间有哪些遗传联系？</text><text x="357" y="231" font-size="17">材料：基因组比较与模型。</text><text x="357" y="282" font-size="17">遗传联系不能确定迁徙路径。</text><rect x="650" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="667" y="137" font-size="21">文化联系</text><text x="667" y="180" font-size="17">问题：技术和实践如何分布？</text><text x="667" y="231" font-size="17">材料：考古组合与比较。</text><text x="667" y="282" font-size="17">文化相似不等于遗传祖源相同。</text><text x="30" y="454" font-size="17">三类证据需要分别论证；此图不提供实际谱系、文化归属或任何虚构祖源百分比。</text></svg>