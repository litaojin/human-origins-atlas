<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="父系、母系与常染色体三扇遗传窗口"><svg xmlns="http://www.w3.org/2000/svg" x="18" y="16" width="300" height="245" viewBox="0 0 300 245" role="img" aria-label="父系：一条直系父系线"><title>父系：一条直系父系线</title><desc>常见遗传方式下，Y 染色体的父系谱系从祖父经父亲传给儿子；不代表所有祖先。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}.minor{fill:#596c64}</style><text x="20" y="30" font-size="19" font-weight="650">Y 染色体 · 父系</text><path d="M45 67V190" stroke="#9c7130" stroke-width="4"/><circle cx="45" cy="75" r="10" fill="#9c7130"/><circle cx="45" cy="130" r="10" fill="#9c7130"/><circle cx="45" cy="185" r="10" fill="#9c7130"/><text x="75" y="81" font-size="19">祖父</text><text x="75" y="136" font-size="19">父亲</text><text x="75" y="191" font-size="19">儿子</text><text x="20" y="230" font-size="15" class="minor">单一直系线 ≠ 全部父方祖先</text></svg><svg xmlns="http://www.w3.org/2000/svg" x="332" y="16" width="300" height="245" viewBox="0 0 300 245" role="img" aria-label="母系：一条直系母系线"><title>母系：一条直系母系线</title><desc>线粒体 DNA 通常经母亲传给子女，男性与女性都有线粒体 DNA。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}.minor{fill:#596c64}</style><text x="20" y="30" font-size="19" font-weight="650">线粒体 DNA · 母系</text><path d="M45 67V190" stroke="#5d7885" stroke-width="4"/><circle cx="45" cy="75" r="10" fill="#5d7885"/><circle cx="45" cy="130" r="10" fill="#5d7885"/><circle cx="45" cy="185" r="10" fill="#5d7885"/><text x="75" y="81" font-size="19">外祖母</text><text x="75" y="136" font-size="19">母亲</text><text x="75" y="191" font-size="19">子女</text><text x="20" y="230" font-size="15" class="minor">男女都有；通常由母亲传递</text></svg><svg xmlns="http://www.w3.org/2000/svg" x="646" y="16" width="300" height="245" viewBox="0 0 300 245" role="img" aria-label="常染色体：来自双亲的多条祖先线"><title>常染色体：来自双亲的多条祖先线</title><desc>多条父方、母方支系汇入子女的遗传信息；色块只是示意，不表示真实祖源比例。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}.minor{fill:#596c64}</style><text x="20" y="30" font-size="19" font-weight="650">常染色体 · 多支祖源</text><text x="18" y="75" font-size="16">父方多支</text><text x="196" y="75" font-size="16">母方多支</text><path d="M53 88L112 129M84 88L126 129M217 88L169 129M246 88L184 129" fill="none" stroke="#7c8e82" stroke-width="2"/><rect x="80" y="147" width="28" height="16" rx="2" fill="#9c7130"/><rect x="113" y="147" width="28" height="16" rx="2" fill="#5d7885"/><rect x="146" y="147" width="28" height="16" rx="2" fill="#c4ab80"/><rect x="179" y="147" width="28" height="16" rx="2" fill="#a8bdc6"/><rect x="80" y="168" width="28" height="16" rx="2" fill="#a8bdc6"/><rect x="113" y="168" width="28" height="16" rx="2" fill="#c4ab80"/><rect x="146" y="168" width="28" height="16" rx="2" fill="#5d7885"/><rect x="179" y="168" width="28" height="16" rx="2" fill="#9c7130"/><text x="91" y="207" font-size="16">子女的遗传信息</text><text x="20" y="230" font-size="15" class="minor">色块不表示实际祖源比例</text></svg></svg>