<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-label="混合、重组和片段保留的概念过程"><title>混合、重组和片段保留的概念过程</title><desc>纯概念示意，无实际基因组，无比例数据。尼安德特人与丹尼索瓦相关研究不能被合成同一次混合事件。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="24" y="35" font-size="23">基因流进入后代后，片段经历重组与保留</text><text x="24" y="74" font-size="17">全部色块为作者示意：不对应真实位点、片段长度、年代或祖源百分比。</text><rect x="24" y="110" width="232" height="215" fill="#f1f5ed" stroke="#d7dfd2"/><text x="37" y="148" font-size="20">原有遗传分支</text><rect x="39" y="185" width="16" height="18" fill="#176f60"/><rect x="59" y="185" width="16" height="18" fill="#176f60"/><rect x="79" y="185" width="16" height="18" fill="#176f60"/><rect x="99" y="185" width="16" height="18" fill="#176f60"/><rect x="119" y="185" width="16" height="18" fill="#176f60"/><rect x="139" y="185" width="16" height="18" fill="#176f60"/><rect x="159" y="185" width="16" height="18" fill="#176f60"/><rect x="179" y="185" width="16" height="18" fill="#176f60"/><rect x="199" y="185" width="16" height="18" fill="#176f60"/><rect x="219" y="185" width="16" height="18" fill="#176f60"/><rect x="39" y="213" width="16" height="18" fill="#a47830"/><rect x="59" y="213" width="16" height="18" fill="#a47830"/><rect x="79" y="213" width="16" height="18" fill="#a47830"/><rect x="99" y="213" width="16" height="18" fill="#a47830"/><rect x="119" y="213" width="16" height="18" fill="#a47830"/><rect x="139" y="213" width="16" height="18" fill="#a47830"/><rect x="159" y="213" width="16" height="18" fill="#a47830"/><rect x="179" y="213" width="16" height="18" fill="#a47830"/><rect x="199" y="213" width="16" height="18" fill="#a47830"/><rect x="219" y="213" width="16" height="18" fill="#a47830"/><text x="37" y="267" font-size="16">不同来源保持差异</text><text x="37" y="295" font-size="16">参考个体不等于全部来源</text><text x="259" y="206" font-size="20">→</text><rect x="276" y="110" width="232" height="215" fill="#f1f5ed" stroke="#d7dfd2"/><text x="289" y="148" font-size="20">发生生育交流</text><rect x="291" y="185" width="16" height="18" fill="#176f60"/><rect x="311" y="185" width="16" height="18" fill="#176f60"/><rect x="331" y="185" width="16" height="18" fill="#a47830"/><rect x="351" y="185" width="16" height="18" fill="#a47830"/><rect x="371" y="185" width="16" height="18" fill="#a47830"/><rect x="391" y="185" width="16" height="18" fill="#176f60"/><rect x="411" y="185" width="16" height="18" fill="#176f60"/><rect x="431" y="185" width="16" height="18" fill="#176f60"/><rect x="451" y="185" width="16" height="18" fill="#176f60"/><rect x="471" y="185" width="16" height="18" fill="#176f60"/><text x="289" y="267" font-size="16">遗传片段进入后代</text><text x="289" y="295" font-size="16">混合不必仅有一次</text><text x="511" y="206" font-size="20">→</text><rect x="528" y="110" width="232" height="215" fill="#f1f5ed" stroke="#d7dfd2"/><text x="541" y="148" font-size="20">世代传递与重组</text><rect x="543" y="185" width="16" height="18" fill="#176f60"/><rect x="563" y="185" width="16" height="18" fill="#a47830"/><rect x="583" y="185" width="16" height="18" fill="#176f60"/><rect x="603" y="185" width="16" height="18" fill="#a47830"/><rect x="623" y="185" width="16" height="18" fill="#176f60"/><rect x="643" y="185" width="16" height="18" fill="#176f60"/><rect x="663" y="185" width="16" height="18" fill="#a47830"/><rect x="683" y="185" width="16" height="18" fill="#176f60"/><rect x="703" y="185" width="16" height="18" fill="#176f60"/><rect x="723" y="185" width="16" height="18" fill="#176f60"/><text x="541" y="267" font-size="16">片段逐渐被打散</text><text x="541" y="295" font-size="16">长度可提供时间信息</text><text x="763" y="206" font-size="20">→</text><rect x="780" y="110" width="232" height="215" fill="#f1f5ed" stroke="#d7dfd2"/><text x="793" y="148" font-size="20">后世保留与比较</text><rect x="795" y="185" width="16" height="18" fill="#176f60"/><rect x="815" y="185" width="16" height="18" fill="#176f60"/><rect x="835" y="185" width="16" height="18" fill="#176f60"/><rect x="855" y="185" width="16" height="18" fill="#a47830"/><rect x="875" y="185" width="16" height="18" fill="#176f60"/><rect x="895" y="185" width="16" height="18" fill="#176f60"/><rect x="915" y="185" width="16" height="18" fill="#a47830"/><rect x="935" y="185" width="16" height="18" fill="#176f60"/><rect x="955" y="185" width="16" height="18" fill="#176f60"/><rect x="975" y="185" width="16" height="18" fill="#176f60"/><text x="793" y="267" font-size="16">漂变、选择与再交流</text><text x="793" y="295" font-size="16">改变片段分布</text><text x="24" y="374" font-size="17">时间估计依赖模型、重组率、世代长度与样本年龄；色块数量不是测量结果。</text></svg>