<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" role="img" aria-label="化石年代与模型时间的语义对照"><title>化石年代与模型时间的语义对照</title><desc>不按比例画时间轴；不是统一置信区间。奥莫 I 的数字约束覆盖层，化石应更早。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#243d34}.muted{fill:#607167}</style><text x="24" y="35" font-size="23" class="">不是同一种“时间”</text><text x="24" y="70" font-size="17" class="">各行保留原研究表达；下图为语义对照，不按横坐标画年代。</text><rect x="20" y="82" width="920" height="84" fill="#f1f5ed"/><text x="36" y="108" font-size="16" class="">关联层位</text><text x="155" y="108" font-size="19" class="">伊尔胡德</text><text x="470" y="108" font-size="20" class="">315 ± 34 ka</text><text x="155" y="141" font-size="16" class="muted">受热石器 → 关联化石层位</text><rect x="20" y="177" width="920" height="84" fill="#f1f5ed"/><text x="36" y="203" font-size="16" class="">最小年龄</text><text x="155" y="203" font-size="19" class="">奥莫 I</text><text x="470" y="203" font-size="20" class="">上覆层约束：233 ± 22 ka</text><text x="155" y="236" font-size="16" class="muted">化石早于覆盖层；界限带不确定性</text><rect x="20" y="272" width="920" height="84" fill="#f1f5ed"/><text x="36" y="298" font-size="16" class="">地层年代</text><text x="155" y="298" font-size="19" class="">赫尔托</text><text x="470" y="298" font-size="20" class="">160–154 ka</text><text x="155" y="331" font-size="16" class="muted">论文报告的年代范围</text><rect x="20" y="367" width="920" height="84" fill="#f5f0e5"/><text x="36" y="393" font-size="16" class="">模型事件</text><text x="155" y="393" font-size="19" class="">弱结构祖干研究</text><text x="470" y="393" font-size="20" class="">约 120–135 ka</text><text x="155" y="426" font-size="16" class="muted">模型内祖先分化；不是物种生日</text></svg>