<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1185" role="img" aria-label="七区域代表性年代记录"><title>七区域代表性年代记录</title><desc>名称、日期、方法来自同一条维护记录；没有统一数值轴。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">代表性材料的年代与证据对象</text><text x="30" y="74" font-size="17">各区分别保留原研究的时期和测年方法；不是同步事件或扩散先后排序。</text><rect x="30" y="104" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="136" font-size="20">西亚 · Ganj Dareh早期牧养者</text><text x="48" y="171" font-size="18">公元前8200—7600年；样本时期覆盖</text><text x="48" y="204" font-size="16">方法与对象：古人骨DNA及14C／考古年代；非单个置信区间</text><rect x="30" y="251" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="283" font-size="20">欧洲 · Lepenski Vir I4665与I5405</text><text x="48" y="318" font-size="18">公元前6200—5600年；两名个体时期概括</text><text x="48" y="351" font-size="16">方法与对象：古DNA及锶／氮同位素；原文年代非合并置信区间</text><rect x="30" y="398" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="430" font-size="20">欧亚草原及南亚联系 · 斯瓦特与吉德拉尔古人骨系列</text><text x="48" y="465" font-size="18">约公元前1200年—公元1700年；系列覆盖</text><text x="48" y="498" font-size="16">方法与对象：古DNA与直接14C／考古年代；非迁入事件日期</text><rect x="30" y="545" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="577" font-size="20">非洲东部与中南部 · Prettejohn’s Gully两名可能早期牧业个体</text><text x="48" y="612" font-size="18">约4000 BP；两名个体时期概括</text><text x="48" y="645" font-size="16">方法与对象：古DNA与遗骸年代背景；约数非共同置信区间</text><rect x="30" y="692" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="724" font-size="20">东亚 · 田螺山稻小穗基盘系列</text><text x="48" y="759" font-size="18">约6900—6600年前；摘要研究阶段</text><text x="48" y="792" font-size="16">方法与对象：植物形态与遗存比较；未把摘要约数标为cal BP</text><rect x="30" y="839" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="871" font-size="20">南岛与西太平洋阅读窗口 · Teouma三名拉皮塔相关个体</text><text x="48" y="906" font-size="18">约3100—2700 BP；三名个体年代概括</text><text x="48" y="939" font-size="16">方法与对象：人骨直接14C与古DNA；原文约数非单个置信区间</text><rect x="30" y="986" width="900" height="135" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="1018" font-size="20">美洲独立农业与中美洲交流 · 伯利兹MHCP与ST的20名古代个体</text><text x="48" y="1053" font-size="18">9600—3700 cal BP；人骨系列总体覆盖</text><text x="48" y="1086" font-size="16">方法与对象：人骨直接AMS 14C、古DNA及饮食同位素对照</text><text x="30" y="1153" font-size="17">样本、考古时期及人口模型分别论证；不将置信区间当作传播持续时间。</text></svg>