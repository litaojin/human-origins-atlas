<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 675" role="img" aria-label="分层年代：存在记录与混合模型时间"><title>分层年代：存在记录与混合模型时间</title><desc>上部横轴210至0ka，下部60至40ka；两套刻度不同。范围不是同一种置信区间，不据此确定离非日期。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="25" y="32" font-size="23">早期存在记录与后期基因流：两种时间尺度</text><text x="25" y="67" font-size="17">上部：原研究年代概括；各范围的测量对象与概率含义不相同。</text><path d="M360 113H990" stroke="#97a89d"/><path d="M390.0 108V118" stroke="#97a89d"/><text x="390.0" y="100" font-size="15" text-anchor="middle">200</text><path d="M540.0 108V118" stroke="#97a89d"/><text x="540.0" y="100" font-size="15" text-anchor="middle">150</text><path d="M690.0 108V118" stroke="#97a89d"/><text x="690.0" y="100" font-size="15" text-anchor="middle">100</text><path d="M840.0 108V118" stroke="#97a89d"/><text x="840.0" y="100" font-size="15" text-anchor="middle">50</text><path d="M990.0 108V118" stroke="#97a89d"/><text x="990.0" y="100" font-size="15" text-anchor="middle">0</text><text x="28" y="109" font-size="16">ka · 较早 → 较晚</text><text x="28" y="150" font-size="18">米斯利亚 · 有年代争议</text><text x="28" y="176" font-size="16">177–194 ka · 原报告解释</text><rect x="408.0" y="150" width="51.0" height="16" rx="3" fill="#176f60"/><text x="28" y="220" font-size="18">斯胡尔／卡夫泽</text><text x="28" y="246" font-size="16">约 90–120 ka · 区域概括</text><rect x="630.0" y="220" width="90.0" height="16" rx="3" fill="#176f60"/><text x="28" y="290" font-size="18">阿尔乌斯塔</text><text x="28" y="316" font-size="16">约 95–86 ka · 综合背景</text><rect x="705.0" y="290" width="27.0" height="16" rx="3" fill="#176f60"/><text x="28" y="356" font-size="16">AW-1 的 87.6 ± 2.5 ka 为最小年龄估计，未画成化石的对称年龄区间。[34]</text><path d="M25 380H1010" stroke="#d7dfd2"/><text x="28" y="409" font-size="17">下部：重组与基因组模型推断的尼安德特人基因流，非离非日期。</text><path d="M360 459H990" stroke="#97a89d"/><path d="M360.0 454V464" stroke="#97a89d"/><text x="360.0" y="446" font-size="15" text-anchor="middle">60</text><path d="M517.5 454V464" stroke="#97a89d"/><text x="517.5" y="446" font-size="15" text-anchor="middle">55</text><path d="M675.0 454V464" stroke="#97a89d"/><text x="675.0" y="446" font-size="15" text-anchor="middle">50</text><path d="M832.5 454V464" stroke="#97a89d"/><text x="832.5" y="446" font-size="15" text-anchor="middle">45</text><path d="M990.0 454V464" stroke="#97a89d"/><text x="990.0" y="446" font-size="15" text-anchor="middle">40</text><text x="28" y="455" font-size="16">ka · 独立放大尺度</text><text x="28" y="500" font-size="18">Iasi 等（2024）</text><text x="28" y="527" font-size="16">50.5–43.5 ka · 延续的共享基因流</text><rect x="659.25" y="500" width="220.5" height="16" rx="3" fill="#a47830"/><text x="28" y="575" font-size="18">Sümer 等（在线 2024）</text><text x="28" y="602" font-size="16">49–45 ka · 共同混合时间估计</text><rect x="706.5" y="575" width="126.0" height="16" rx="3" fill="#a47830"/><text x="28" y="646" font-size="16">条带保留论文报告的时段范围，不表示统一置信水平；上下横坐标不可直接对齐比较。</text></svg>