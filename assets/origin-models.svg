<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 465" role="img" aria-label="三类起源解释的概念结构比较"><title>三类起源解释的概念结构比较</title><desc>比较单一来源、古老混入与长期结构模型。不是原论文参数图；不暗示三类模型已经同等获支持。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#243d34}.muted{fill:#607167}</style><text x="24" y="35" font-size="23" class="">比较模型，而不是挑一张最顺眼的祖先图</text><g transform="translate(24,60)"><rect width="295" height="295" fill="#f1f5ed" stroke="#dce4d9"/><text x="15" y="35" font-size="21" class="">单一祖先群扩张</text><path d="M147 70V130M147 130L65 220M147 130L230 220" fill="none" stroke="#176f60" stroke-width="3"/><text x="18" y="255" font-size="15" class="muted">概念结构；无真实地理或比例</text></g><g transform="translate(338,60)"><rect width="295" height="295" fill="#f1f5ed" stroke="#dce4d9"/><text x="15" y="35" font-size="21" class="">古老分支混入</text><path d="M75 70V220M215 70V220M215 150L75 185" fill="none" stroke="#176f60" stroke-width="3"/><text x="18" y="255" font-size="15" class="muted">概念结构；无真实地理或比例</text></g><g transform="translate(652,60)"><rect width="295" height="295" fill="#f1f5ed" stroke="#dce4d9"/><text x="15" y="35" font-size="21" class="">长期结构与交流</text><path d="M75 70V220M215 70V220M75 95L215 120M215 155L75 180M75 195L215 215" fill="none" stroke="#176f60" stroke-width="3"/><text x="18" y="255" font-size="15" class="muted">概念结构；无真实地理或比例</text></g><text x="24" y="395" font-size="18" class="">三幅都是作者教学示意：不对应物种、民族、遗址或精确事件年代。</text><text x="24" y="430" font-size="18" class="">线表示模型中的传承／交流关系；不是迁徙路径。</text></svg>