ize="21" font-weight="600">BT</text></g><g data-lineage="B"><rect x="80" y="200" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="152" y="230" text-anchor="middle" font-size="21" font-weight="600">B-M60</text></g><g data-lineage="CT"><rect x="440" y="200" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="512" y="230" text-anchor="middle" font-size="21" font-weight="600">CT-M168</text></g><g data-lineage="DE"><rect x="320" y="312" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="392" y="342" text-anchor="middle" font-size="21" font-weight="600">DE</text></g><g data-lineage="CF"><rect x="672" y="312" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="744" y="342" text-anchor="middle" font-size="21" font-weight="600">CF</text></g><g data-lineage="D"><rect x="240" y="424" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="312" y="454" text-anchor="middle" font-size="21" font-weight="600">D 谱系</text></g><g data-lineage="E"><rect x="400" y="424" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="472" y="454" text-anchor="middle" font-size="21" font-weight="600">E-M96</text></g><g data-lineage="C"><rect x="592" y="424" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="664" y="454" text-anchor="middle" font-size="21" font-weight="600">C-M130</text></g><g data-lineage="F"><rect x="752" y="424" width="144" height="48" rx="6" fill="#fbfcf8" stroke="#607167"/><text x="824" y="454" text-anchor="middle" font-size="21" font-weight="600">F-M89</text></g><text x="28" y="516" font-size="18" fill="#607167">A00、A0 等更深支系未画；F 以下仍有大量分支。</text><text x="28" y="544" font-size="18" fill="#607167">D 侧包括 Haber 2019 命名的 D0；此处不展开 D 的内部关系。</text></svg>