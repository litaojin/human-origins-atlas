<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" role="img" aria-label="从遗存到人口历史解释的四个步骤"><title>从遗存到人口历史解释的四个步骤</title><desc>流程概念图；后一步依赖前面的证据，并非每个步骤都能消除不确定性。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}.minor{fill:#596c64}</style><g transform="translate(20 20)"><rect width="270" height="145" fill="#f1f5ed" stroke="#d7dfd2"/><text x="18" y="32" font-size="14" fill="#5c7367">01</text><text x="18" y="68" font-size="22">遗存与语境</text><text x="18" y="102" font-size="16">发现位置、地层、年代</text><text x="18" y="129" font-size="15">先确认材料来自哪里</text></g><g transform="translate(310 20)"><rect width="270" height="145" fill="#f1f5ed" stroke="#d7dfd2"/><text x="18" y="32" font-size="14" fill="#5c7367">02</text><text x="18" y="68" font-size="22">数据鉴定</text><text x="18" y="102" font-size="16">损伤、污染、数据质量</text><text x="18" y="129" font-size="15">先判断 DNA 是否可信</text></g><g transform="translate(600 20)"><rect width="270" height="145" fill="#f1f5ed" stroke="#d7dfd2"/><text x="18" y="32" font-size="14" fill="#5c7367">03</text><text x="18" y="68" font-size="22">样本比较</text><text x="18" y="102" font-size="16">古今样本、遗传统计</text><text x="18" y="129" font-size="15">明确与谁比较、怎样比较</text></g><g transform="translate(890 20)"><rect width="270" height="145" fill="#f1f5ed" stroke="#d7dfd2"/><text x="18" y="32" font-size="14" fill="#5c7367">04</text><text x="18" y="68" font-size="22">历史解释</text><text x="18" y="102" font-size="16">比较模型、其他学科证据</text><text x="18" y="129" font-size="15">说明支持什么、仍未知什么</text></g></svg>