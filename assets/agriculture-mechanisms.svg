<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-label="三种证据及其解释边界"><title>三种证据及其解释边界</title><desc>人口移动和文化交流不是互斥选项；不提供语言与祖源的一一对应。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">生产方式、人口与语言：三类证据</text><rect x="30" y="90" width="280" height="355" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="46" y="124" font-size="21">生产方式</text><text x="46" y="154" font-size="18">作物、家畜与实践提供考古证据</text><text x="46" y="181" font-size="18">。</text><text x="46" y="228" font-size="18">技术可由当地采用或随人群迁入</text><text x="46" y="255" font-size="18">。</text><text x="46" y="302" font-size="18">相似生产组合不等于同一祖源。</text><rect x="340" y="90" width="280" height="355" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="356" y="124" font-size="21">人口历史</text><text x="356" y="154" font-size="18">古基因组比较时空中的遗传联系</text><text x="356" y="181" font-size="18">。</text><text x="356" y="228" font-size="18">迁入与当地延续、混合可以并存</text><text x="356" y="255" font-size="18">。</text><text x="356" y="302" font-size="18">祖源变化不能独自确定语言。</text><rect x="650" y="90" width="280" height="355" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="666" y="124" font-size="21">语言与交流</text><text x="666" y="154" font-size="18">语言比较提供语言关系与扩散模</text><text x="666" y="181" font-size="18">型。</text><text x="666" y="228" font-size="18">借用、转换与延续须单独论证。</text><text x="666" y="275" font-size="18">基因组不能直接读取古人所说语</text><text x="666" y="302" font-size="18">言。</text><text x="30" y="483" font-size="17">作者证据责任对照；不是演进阶段、实测族谱或祖源比例估计。</text></svg>