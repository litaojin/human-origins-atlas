<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-label="延续、迁入和采样模型"><title>延续、迁入和采样模型</title><desc>三个解释层次可以并存；不绘制虚构祖源比例。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">遗传组成变化的三个解释层次</text><rect x="30" y="90" width="280" height="340" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="46" y="123" font-size="21">延续与内部变化</text><text x="46" y="151" font-size="18">同一地区前后样本有遗传联系。</text><text x="46" y="202" font-size="18">漂变、瓶颈与内部结构也会改变</text><text x="46" y="229" font-size="18">频率。</text><text x="46" y="280" font-size="18">延续不等于长期完全隔离。</text><rect x="340" y="90" width="280" height="340" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="356" y="123" font-size="21">迁入与混合</text><text x="356" y="151" font-size="18">时序样本支持新的遗传联系。</text><text x="356" y="202" font-size="18">迁入可以与原有人群延续并存。</text><text x="356" y="253" font-size="18">比例和路线须分别检验。</text><rect x="650" y="90" width="280" height="340" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="666" y="123" font-size="21">采样与模型</text><text x="666" y="151" font-size="18">样本来自有限地点和时期。</text><text x="666" y="202" font-size="18">缺少中间样本会限制解释。</text><text x="666" y="253" font-size="18">模型分组不是固定族群。</text><text x="30" y="467" font-size="17">作者概念对照；不是实际家系、人口规模或祖源比例估计。</text></svg>