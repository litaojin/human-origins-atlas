<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 497" role="img" aria-label="环境条件与通行问题的三个层次"><title>环境条件与通行问题的三个层次</title><desc>仅比较陆地暴露、冰盖与宜居性、海峡跨越三个概念；不是路线或古环境数据图。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">环境条件与通行问题的三个层次</text><text x="30" y="74" font-size="17">作者概念对照 · 非古地理复原 · 无定量人口或祖源估计</text><rect x="30" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="47" y="137" font-size="21">陆地暴露</text><text x="47" y="180" font-size="17">海面变化与陆地连接是地理条件</text><text x="47" y="207" font-size="17">问题。</text><text x="47" y="258" font-size="17">暴露陆地不等于已被人群使用。</text><text x="47" y="309" font-size="17">本图不绘制古海岸线。</text><rect x="340" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="357" y="137" font-size="21">冰盖与宜居性</text><text x="357" y="180" font-size="17">地表可达与适合长期生存是不同</text><text x="357" y="207" font-size="17">问题。</text><text x="357" y="258" font-size="17">需要分别检验环境与人类活动证</text><text x="357" y="285" font-size="17">据。</text><text x="357" y="336" font-size="17">本图不绘制冰盖边界。</text><rect x="650" y="105" width="280" height="310" rx="10" fill="#f0f7f3" stroke="#bed6c9"/><text x="667" y="137" font-size="21">海峡与跨海</text><text x="667" y="180" font-size="17">陆地之间的海水阻隔需要独立讨</text><text x="667" y="207" font-size="17">论。</text><text x="667" y="258" font-size="17">地理位置不能单独确定渡海方式</text><text x="667" y="285" font-size="17">或地点。</text><text x="667" y="336" font-size="17">本图不标注精确路径。</text><text x="30" y="454" font-size="17">三个层次不是一次迁徙的连续步骤；不提供确切海岸、冰缘、渡海地点或精确路径。</text></svg>