<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1068" role="img" aria-label="六区域证据窗口与边界比较"><title>六区域证据窗口与边界比较</title><desc>作者依据各证据卡概括观察和解释范围；不是人口更替规模排名。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">不同地区的观察窗口与解释边界</text><text x="30" y="74" font-size="17">证据能力对照 · 不是人口变化幅度的定量排名</text><rect x="30" y="108" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="138" font-size="21">欧洲</text><text x="48" y="173" font-size="18">观察窗口：跨冰盛期与晚冰期古基因组；沉积DNA提供补充。</text><text x="48" y="210" font-size="18">解释边界：延续与交流并存；缺失时段和层位关联仍限制路线解释。</text><rect x="30" y="266" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="296" font-size="21">西亚</text><text x="48" y="331" font-size="18">观察窗口：晚冰期狩猎采集者与较晚古代样本的比较。</text><text x="48" y="368" font-size="18">解释边界：少数遗址不能代表整个西亚；遗传亲缘不确定唯一通道。</text><rect x="30" y="424" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="454" font-size="21">东亚</text><text x="48" y="489" font-size="18">观察窗口：阿穆尔跨时段与内陆早期全新世材料。</text><text x="48" y="526" font-size="18">解释边界：部分仅据摘要；局部变化与广域延续需要分层比较。</text><rect x="30" y="582" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="612" font-size="21">非洲（东部、中南部与南部）</text><text x="48" y="647" font-size="18">观察窗口：晚更新世至全新世材料；东部和南部序列。</text><text x="48" y="684" font-size="18">解释边界：直接、间接年代与保存差别；人口结构影响有效大小估计。</text><rect x="30" y="740" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="770" font-size="21">白令地区与美洲</text><text x="48" y="805" font-size="18">观察窗口：接近全新世边界的阿拉斯加USR1古基因组。</text><text x="48" y="842" font-size="18">解释边界：样本日期不同于模型分化日期；单个地点不覆盖全美洲。</text><rect x="30" y="898" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="928" font-size="21">萨胡尔</text><text x="48" y="963" font-size="18">观察窗口：考古、现代基因组与综述提供比较框架。</text><text x="48" y="1000" font-size="18">解释边界：目标时期连续古DNA缺口；模型年份不是直接遗骸日期。</text></svg>