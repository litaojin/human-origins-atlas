<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 525" role="img" aria-label="不同材料能够支持的联系与局限"><title>不同材料能够支持的联系与局限</title><desc>三组案例比较活动存在、遗传亲缘和后世延续，不能互相替代；不是实际人口树。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="24" y="35" font-size="23">活动记录、样本比较与祖源延续</text><text x="36" y="88" font-size="19">材料</text><text x="367" y="88" font-size="19">比较可支持的关系</text><text x="698" y="88" font-size="19">不能由此单独推断</text><rect x="24" y="110" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="38" y="143" font-size="18">黎凡特／阿拉伯化石</text><text x="38" y="174" font-size="16">早期活动记录</text><rect x="355" y="110" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="369" y="143" font-size="18">形态、层位与年代</text><text x="369" y="174" font-size="16">支持早期存在的解释</text><rect x="686" y="110" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="700" y="143" font-size="18">没有对应基因组</text><text x="700" y="174" font-size="16">难以检验具体后世贡献</text><text x="333" y="162" font-size="20">→</text><text x="664" y="162" font-size="20">→</text><rect x="24" y="222" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="38" y="255" font-size="18">巴乔基罗早期基因组</text><text x="38" y="286" font-size="16">在欧洲发现的古代个体</text><rect x="355" y="222" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="369" y="255" font-size="18">与部分东亚／美洲样本</text><text x="369" y="286" font-size="16">具有较近遗传联系</text><rect x="686" y="222" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="700" y="255" font-size="18">亲缘关系非迁徙路线</text><text x="700" y="286" font-size="16">非当时已有现代民族</text><text x="333" y="274" font-size="20">→</text><text x="664" y="274" font-size="20">→</text><rect x="24" y="334" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="38" y="367" font-size="18">拉尼斯／金马基因组</text><text x="38" y="398" font-size="16">地理上分处两地的个体</text><rect x="355" y="334" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="369" y="367" font-size="18">远亲联系与早期分支</text><text x="369" y="398" font-size="16">后世贡献有限或难检出</text><rect x="686" y="334" width="305" height="91" fill="#f1f5ed" stroke="#d7dfd2"/><text x="700" y="367" font-size="18">存在不等于直接祖先</text><text x="700" y="398" font-size="16">非完整人口普查</text><text x="333" y="386" font-size="20">→</text><text x="664" y="386" font-size="20">→</text><text x="24" y="490" font-size="17">作者证据解释图；箭头表示论证顺序，不表示地理迁徙或实际祖先谱系。</text></svg>