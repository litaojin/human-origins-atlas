<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1482" role="img" aria-label="气候与区域证据年代分层"><title>气候与区域证据年代分层</title><desc>气候地层基准和样本、模型时间分别记录；没有虚构统一年代轴。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">气候基准与人口证据：分别记录</text><text x="30" y="74" font-size="17">文字分层，不绘制统一数值轴；气候分界不是全球同步人口事件。</text><rect x="30" y="112" width="900" height="129" rx="8" fill="#eef3f9" stroke="#cbded4"/><text x="48" y="142" font-size="20">气候基准 · 全新世底界（Holocene GSSP）</text><text x="48" y="172" font-size="18">11,700 calendar yr b2k（以公元2000年为参照）；maximum counting error 99 yr（最大计数误差）</text><text x="48" y="199" font-size="16">NGRIP冰芯年度层计数；正式地层基准，不是人口事件。</text><rect x="30" y="253" width="900" height="129" rx="8" fill="#eef3f9" stroke="#cbded4"/><text x="48" y="283" font-size="20">气候基准 · 末次冰盛期主要海面低位阶段</text><text x="48" y="313" font-size="18">约26.5—19 ka，Clark2009综合阶段跨度；非单一测量置信区间</text><text x="48" y="340" font-size="16">多种环境记录综合的阶段跨度；不是单一样本置信区间。</text><text x="30" y="419" font-size="20">代表性人口材料 · 名称、日期与方法逐项对应</text><rect x="30" y="442" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="472" font-size="20">Villabruna相关分组（Fu2016）</text><text x="48" y="502" font-size="18">约14—7 ka，分组中不同个体的时期覆盖</text><text x="48" y="529" font-size="16">古代个体分组的时代覆盖；非迁入时间或单一样本置信区间。</text><rect x="30" y="583" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="613" font-size="20">Pınarbaşı AHG</text><text x="48" y="643" font-size="18">约15 ka，原论文用于概述的个体年龄</text><text x="48" y="670" font-size="16">人骨直接14C；这里只用原文约数，非完整校正概率范围。</text><rect x="30" y="724" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="754" font-size="20">东胡林材料（Zhang2026）</text><text x="48" y="784" font-size="18">约11—9 ka，摘要所述不同个体总覆盖</text><text x="48" y="811" font-size="16">仅摘要；不同个体总体覆盖，个体校正方式与误差未核验。</text><rect x="30" y="865" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="895" font-size="20">Lipson2022新增东非及中南部材料</text><text x="48" y="925" font-size="18">约18—5 ka，不同个体的总体覆盖</text><text x="48" y="952" font-size="16">混有直接、间接年代；不同个体覆盖，非每人共同测年范围。</text><rect x="30" y="1006" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="1036" font-size="20">南非全新世较早样本（Jakobsson2025/2026）</text><text x="48" y="1066" font-size="18">约10 ka，正文概括较早个体时代</text><text x="48" y="1093" font-size="16">全新世古人骨与年代背景；非冰盛期直接序列。</text><rect x="30" y="1147" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="1177" font-size="20">Upward Sun River USR1</text><text x="48" y="1207" font-size="18">约11.5 ka，论文引用的遗骸年代概括</text><text x="48" y="1234" font-size="16">遗骸与埋葬年代背景的约数；不是更早分化的模型日期。</text><rect x="30" y="1288" width="900" height="129" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="1318" font-size="20">萨胡尔目标时期的古DNA窗口</text><text x="48" y="1348" font-size="18">晚冰期至早期全新世；本次查阅缺口</text><text x="48" y="1375" font-size="16">本章资料的证据缺口；不是实测时间条，也不是无人居住。</text><text x="30" y="1449" font-size="17">b2k、cal BP、模型年龄保留各自参照和限定，不作为同等精度的迁徙时间。</text></svg>