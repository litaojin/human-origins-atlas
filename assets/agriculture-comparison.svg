<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1214" role="img" aria-label="区域证据范围对照"><title>区域证据范围对照</title><desc>文字直接来自各证据卡的正面观察和限定；不量化人口更替。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253d36}[hidden]{display:none}.active{stroke-width:4;fill-opacity:.3}</style><text x="30" y="37" font-size="24">七区域的观察窗口与解释边界</text><text x="30" y="74" font-size="17">并列研究能力；不是扩散规模、人口变化强度或证据优劣排名。</text><rect x="30" y="106" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="136" font-size="21">西亚</text><text x="48" y="171" font-size="18">观察窗口：地方连续性与后来混合均可检验</text><text x="48" y="206" font-size="18">解释边界：祖源差异不直接确定驯化地点或语言</text><rect x="30" y="262" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="292" font-size="21">欧洲</text><text x="48" y="327" font-size="18">观察窗口：迁入、混合与饮食可在同区对照</text><text x="48" y="362" font-size="18">解释边界：少量接触区样本不能代表全欧洲生活方式</text><rect x="30" y="418" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="448" font-size="21">欧亚草原及南亚联系</text><text x="48" y="483" font-size="18">观察窗口：古DNA可区分多阶段草原相关贡献</text><text x="48" y="518" font-size="18">解释边界：祖源标签不等于牧业职业或印欧语言</text><rect x="30" y="574" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="604" font-size="21">非洲东部与中南部</text><text x="48" y="639" font-size="18">观察窗口：牧业混合与班图相关扩展有不同证据链</text><text x="48" y="674" font-size="18">解释边界：现代语言与遗传距离不必对应同一轮扩散</text><rect x="30" y="730" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="760" font-size="21">东亚</text><text x="48" y="795" font-size="18">观察窗口：粮作遗存与人口交流能够分别检验</text><text x="48" y="830" font-size="18">解释边界：遗传论文不替代植物驯化或农业起点证据</text><rect x="30" y="886" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="916" font-size="21">南岛与西太平洋阅读窗口</text><text x="48" y="951" font-size="18">观察窗口：早期与较晚祖源变化可作跨时段对照</text><text x="48" y="986" font-size="18">解释边界：语言延续不证明人口不变或唯一航行路线</text><rect x="30" y="1042" width="900" height="144" rx="8" fill="#f0f7f3" stroke="#cbded4"/><text x="48" y="1072" font-size="21">美洲独立农业与中美洲交流</text><text x="48" y="1107" font-size="18">观察窗口：独立作物起源与较晚人口移动可并存</text><text x="48" y="1142" font-size="18">解释边界：作物日期不能配给伯利兹人口迁入事件</text></svg>